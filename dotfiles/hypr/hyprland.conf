############################
# BASIC HYPRLAND CONFIG
############################

# ----- Monitor -----
monitor = ,preferred,auto,1

# If still zoomed, change last number to:
# 1.25  1.5  1.75  2

# ----- Apps -----
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# ----- Autostart -----
exec-once = waybar
exec-once = swaync
exec-once = nm-applet

# ----- Input -----
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ----- General Look -----
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(f79000ee) rgba(ff0000ee) 45deg
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 4
}

# ----- Keybinds -----

# Terminal
bind = SUPER, Return, exec, $terminal

# App launcher
bind = SUPER, D, exec, ~/.config/rofi/launchers/type-2/launcher.sh || pkill rofi 

# File manager
bind = SUPER, E, exec, $fileManager

# Close window
bind = SUPER, Q, killactive

# Exit Hyprland
bind = SUPER SHIFT, Q, exit

#Waybar
bind=SUPER, R ,exec, ~/.config/waybar/scripts/launch.sh

# Fullscreen
bind = SUPER, F, fullscreen

# Move focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Screenshot (area)
bind = SUPER, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot.png


animations {
    enabled = yes
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, easeOut, slide
    animation = windowsOut, 1, 5, easeOut, slide
    animation = border, 1, 8, easeOut
    animation = fade, 1, 8, easeOut
    animation = workspaces, 1, 6, easeOut, slide
}

#To Lock Hyprland
bind = SUPER, L, exec, hyprlock

exec-once = hypridle

bind = SUPER, X, exec, ~/.config/hypr/powermenu.sh


# exec-once = swww-daemon

exec-once = awww-daemon
exec-once = blueman-applet

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


